name: Comprobar vehículos de ocasión

on:
  # El disparador "schedule" de GitHub Actions NO es fiable en repos de poca
  # actividad: puede retrasarse varias horas sin avisar. Por eso este workflow
  # se lanza desde un cron externo (cron-job.org) que llama a la API de GitHub
  # para disparar "workflow_dispatch" cada 20 minutos con precisión real.
  # Ver el README para configurarlo.
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para poder hacer commit del estado actualizado

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar comprobación (incluye login automático)
        env:
          EMPLOYEE_NUMBER: ${{ secrets.EMPLOYEE_NUMBER }}
          SOCIETY: ${{ secrets.SOCIETY }}
          LOGIN_ROUTE: ${{ secrets.LOGIN_ROUTE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_vehiculos.py

      - name: Guardar estado actualizado en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/estado_vehiculos.json
          git diff --staged --quiet || git commit -m "Actualizar estado de vehículos vistos"
          git push
