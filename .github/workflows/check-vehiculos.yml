name: Comprobar vehículos de ocasión

on:
  schedule:
    # Cada 20 minutos. Sintaxis cron: minuto hora día mes día-semana
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write   # necesario para poder hacer commit del estado actualizado

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar comprobación (incluye login automático)
        env:
          EMPLOYEE_NUMBER: ${{ secrets.EMPLOYEE_NUMBER }}
          SOCIETY: ${{ secrets.SOCIETY }}
          LOGIN_ROUTE: ${{ secrets.LOGIN_ROUTE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_vehiculos.py

      - name: Guardar estado actualizado en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ids_conocidos.json
          git diff --staged --quiet || git commit -m "Actualizar estado de vehículos vistos"
          git push
